[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-can-fcw-simulation"
version = "0.1.0"
description = "A clearly labelled virtual-CAN forward collision warning demonstration"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "ultralytics>=8.0",
    "python-can>=4.3",
    "cantools>=39.0",
    "msgpack>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
